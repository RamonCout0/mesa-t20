<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mesa T20</title>
    <link rel="stylesheet" href="/comum.css" />
    <style>
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(900px 520px at 50% 18%, rgba(112, 72, 196, 0.22), transparent 65%),
          radial-gradient(700px 420px at 50% 110%, rgba(196, 64, 76, 0.14), transparent 65%),
          var(--bg);
      }
      main { width: min(720px, 100%); padding: 48px 16px; display: grid; justify-items: center; gap: 10px; text-align: center; }

      .brasao {
        position: relative;
        width: 96px;
        height: 96px;
        display: grid;
        place-items: center;
        margin-bottom: 14px;
        border-radius: 50%;
        color: var(--ouro);
        background: radial-gradient(circle at 50% 28%, #33254a, #120c1b 75%);
        box-shadow:
          inset 0 0 0 1px rgba(255, 236, 190, 0.28),
          inset 0 0 22px rgba(232, 195, 122, 0.2),
          0 0 0 2px #b8893e,
          0 0 0 6px rgba(8, 5, 12, 0.9),
          0 0 0 7px rgba(232, 195, 122, 0.4),
          0 0 50px rgba(232, 195, 122, 0.25);
      }
      .brasao::before {
        content: '';
        position: absolute;
        inset: -22px;
        border-radius: 50%;
        border: 1px dashed rgba(232, 195, 122, 0.35);
        animation: girar 40s linear infinite;
      }
      .brasao svg { width: 52px; height: 52px; fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linejoin: round; filter: drop-shadow(0 0 8px rgba(232, 195, 122, 0.6)); }

      h1 {
        margin: 0;
        font: 700 clamp(40px, 8vw, 64px)/1 var(--fonte-titulo);
        letter-spacing: 0.18em;
        text-indent: 0.18em;
        text-transform: uppercase;
        background: var(--grad-ouro);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 3px 0 #1a0c08) drop-shadow(0 0 22px rgba(232, 195, 122, 0.35));
      }
      .sub { display: flex; align-items: center; gap: 14px; margin: 6px 0 26px; color: var(--suave); font-size: 13px; letter-spacing: 0.24em; text-transform: uppercase; }
      .sub::before, .sub::after { content: ''; width: 48px; height: 1px; background: linear-gradient(90deg, transparent, rgba(232, 195, 122, 0.6)); }
      .sub::after { transform: scaleX(-1); }

      .portas { width: 100%; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
      a.porta {
        position: relative;
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 16px;
        padding: 22px 20px;
        border-radius: 18px;
        text-align: left;
        text-decoration: none;
        color: var(--texto);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0.015)), var(--superficie);
        box-shadow: inset 0 0 0 1px var(--linha), 0 14px 34px rgba(0, 0, 0, 0.35);
        transition: transform 220ms var(--ease-suave), box-shadow 220ms;
      }
      a.porta:hover, a.porta:focus-visible {
        outline: none;
        transform: translateY(-3px);
        box-shadow: inset 0 0 0 1px rgba(232, 195, 122, 0.6), 0 0 0 1px rgba(232, 195, 122, 0.25), 0 20px 44px rgba(0, 0, 0, 0.45), 0 0 34px rgba(232, 195, 122, 0.14);
      }
      .icone-porta {
        width: 52px;
        height: 52px;
        display: grid;
        place-items: center;
        border-radius: 14px;
        color: var(--ouro);
        background: radial-gradient(circle at 50% 28%, #33254a, #120c1b 78%);
        box-shadow: inset 0 0 0 1px rgba(232, 195, 122, 0.4);
      }
      .icone-porta svg, .seta svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      a.porta b { display: block; margin-bottom: 4px; font: 700 20px var(--fonte-titulo); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ouro); }
      a.porta span { color: var(--suave); font-size: 13.5px; line-height: 1.45; }
      .seta { color: var(--apagado); transition: transform 220ms var(--ease-suave), color 220ms; }
      .seta svg { width: 20px; height: 20px; stroke-width: 2; }
      a.porta:hover .seta { color: var(--ouro); transform: translateX(3px); }
      .rodape { margin-top: 26px; color: var(--apagado); font-size: 12px; }
      @keyframes girar { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <main>
      <div class="brasao" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 2.5 20.5 7.4v9.2L12 21.5l-8.5-4.9V7.4z" /><path d="M12 7.3 16.5 15h-9z" /><path d="M3.5 7.4 12 7.3l8.5.1M3.5 7.4 7.5 15M20.5 7.4 16.5 15M3.5 16.6l4-1.6M20.5 16.6l-4-1.6M7.5 15 12 21.5l4.5-6.5" /></svg>
      </div>
      <h1>Mesa T20</h1>
      <p class="sub">Escolha a tela deste aparelho</p>
      <div class="portas">
        <a class="porta" href="/mestre">
          <span class="icone-porta"><svg viewBox="0 0 24 24"><path d="M12 21.5s7.5-3.5 7.5-9.5V5.5L12 2.5 4.5 5.5V12c0 6 7.5 9.5 7.5 9.5Z" /><path d="m9 12 2 2 4-4" /></svg></span>
          <span><b>Mestre</b><span>Controla PV, turnos, boss e efeitos. Só no computador do programa.</span></span>
          <span class="seta"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></svg></span>
        </a>
        <a class="porta" href="/telao?fundo=1">
          <span class="icone-porta"><svg viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="13" rx="2" /><path d="M8 21h8M12 17v4" /></svg></span>
          <span><b>Telão</b><span>TV ou projetor. No OBS use /telao (fundo transparente).</span></span>
          <span class="seta"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></svg></span>
        </a>
      </div>
      <p class="rodape">No telão: F = tela cheia · B = liga/desliga o fundo</p>
    </main>
  </body>
</html>
