<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mesa T20 — Telão</title>
    <link rel="stylesheet" href="/comum.css" />
    <link rel="stylesheet" href="/telao.css" />
  </head>
  <body class="pagina-telao">
    <div class="raiz" id="raiz">
      <!-- Ambiente: so aparece com fundo (TV / projetor). No OBS o telao fica transparente. -->
      <div class="ambiente" aria-hidden="true">
        <div class="nevoa"></div>
        <div class="nevoa nevoa-2"></div>
        <div class="tingir"></div>
        <div class="poeira" id="poeira"></div>
        <div class="grao"></div>
        <div class="vinheta"></div>
      </div>

      <!-- Ordem de turno -->
      <div class="ordem" id="ordem"><div class="rodada" id="rodada"></div><div class="fila" id="fila"></div></div>

      <!-- Campo: boss no meio, capangas nos flancos -->
      <main class="campo sem-boss" id="campo">
        <div class="flanco esq" id="flancoEsq"></div>

        <div class="boss" id="boss">
          <div class="selo-ameaca" id="avisoAmeaca"></div>
          <div class="palco">
            <div class="energia" aria-hidden="true">
              <div class="cam cam-a"></div><div class="cam cam-b"></div><div class="cam cam-c"></div>
              <div class="onda"></div><div class="onda onda-2"></div><div class="onda onda-3"></div>
              <div class="brasas" id="brasas"></div>
            </div>
            <svg class="circulo" viewBox="-100 -100 200 200" aria-hidden="true">
              <g class="anel-a">
                <circle r="97" stroke-width="0.6" opacity="0.7" />
                <circle r="92" stroke-width="3.2" stroke-dasharray="0.8 5.2" opacity="0.75" />
                <circle r="87" stroke-width="0.5" opacity="0.5" />
              </g>
              <g class="anel-b">
                <circle r="79" stroke-width="0.9" stroke-dasharray="16 5 2 5" opacity="0.6" />
                <path d="M0-79 68.4 39.5-68.4 39.5ZM0 79-68.4-39.5 68.4-39.5Z" stroke-width="0.7" opacity="0.4" />
              </g>
              <g class="anel-c">
                <circle r="58" stroke-width="0.6" opacity="0.45" />
                <path d="M0-64 3-58 0-52-3-58ZM0 64 3 58 0 52-3 58ZM-64 0-58 3-52 0-58-3ZM64 0 58 3 52 0 58-3Z" fill="currentColor" stroke="none" opacity="0.8" />
              </g>
            </svg>
            <div class="moldura" id="molduraBoss">
              <div class="arte" id="arteBoss"></div>
              <i class="canto c1"></i><i class="canto c2"></i><i class="canto c3"></i><i class="canto c4"></i>
              <div class="estrela" id="estrela">
                <svg viewBox="0 0 100 100" aria-hidden="true">
                  <path fill="currentColor" stroke="#fff" stroke-opacity="0.7" stroke-width="2" stroke-linejoin="round" d="M50 4 61.2 34.6 93.8 35.8 68.1 55.9 77 87.2 50 69 23 87.2 31.9 55.9 6.2 35.8 38.8 34.6Z" />
                  <path fill="#000" opacity="0.28" d="M50 50 50 4 61.2 34.6ZM50 50 93.8 35.8 68.1 55.9ZM50 50 77 87.2 50 69ZM50 50 23 87.2 31.9 55.9ZM50 50 6.2 35.8 38.8 34.6Z" />
                  <circle cx="50" cy="50" r="7" fill="#fff" opacity="0.85" />
                </svg>
              </div>
              <div class="iniciativa-boss" id="iniBoss"></div>
              <div class="na-vez">Na vez</div>
              <div class="selo-derrota">Derrotado</div>
            </div>
          </div>
          <div class="placa">
            <div class="boss-nome" id="bossNome"></div>
            <div class="boss-sub" id="bossSub"></div>
          </div>
          <div class="boss-vida">
            <div class="trilho"><div class="barra" id="bossBarra"></div></div>
            <div class="conds" id="bossConds"></div>
          </div>
          <div class="habilidades" id="bossHabs"></div>
        </div>

        <div class="flanco dir" id="flancoDir"></div>
      </main>

      <!-- Os seis herois -->
      <footer class="grupo" id="grupo"></footer>

      <!-- Imagem que o mestre mostra aos jogadores (aba Galeria) -->
      <div class="vitrine" id="vitrine" aria-hidden="true">
        <figure class="vitrine-quadro" id="vitrineQuadro">
          <div class="vitrine-moldura">
            <div class="vitrine-img"><img id="vitrineImg" alt="" /></div>
            <i class="canto c1"></i><i class="canto c2"></i><i class="canto c3"></i><i class="canto c4"></i>
          </div>
          <figcaption id="vitrineTitulo" hidden><span></span></figcaption>
        </figure>
      </div>

      <div class="fx" id="fx"></div>
      <div class="clarao-invocacao" id="clarao"></div>
      <div class="aviso-conexao" id="conexao"><i></i>Sem conexão com o servidor…</div>
    </div>
    <script type="module" src="/telao.js"></script>
  </body>
</html>
