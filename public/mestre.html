<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mesa T20 — Mestre</title>
    <link rel="stylesheet" href="/comum.css" />
    <link rel="stylesheet" href="/mestre.css" />
  </head>
  <body class="pagina-mestre">
    <header class="topo">
      <div class="topo-esq">
        <div class="marca">
          <span class="emblema" data-icone="d20"></span>
          <div><b>Mesa T20</b><small>Painel do mestre</small></div>
        </div>
        <nav class="abas" role="tablist">
          <button class="aba" role="tab" data-aba="combate" data-icone="espada"><span>Combate</span></button>
          <button class="aba" role="tab" data-aba="galeria" data-icone="imagem"><span>Galeria</span><i class="ponto-ar" title="Há uma imagem no telão" hidden></i></button>
        </nav>
      </div>

      <div class="turno-barra" id="turnoBarra"></div>

      <div class="topo-acoes">
        <div class="no-telao" id="noTelao" hidden>
          <span class="retrato" id="noTelaoImg"></span>
          <button class="no-telao-texto" id="noTelaoIr" title="Abrir a galeria"><small>No telão</small><b id="noTelaoTitulo"></b></button>
          <button class="btn icone pequeno fantasma" id="noTelaoEsconder" title="Esconder dos jogadores" data-icone="fechar"></button>
        </div>
        <span class="status" id="status" title="Conexão com o servidor"><i></i><span>Conectando…</span></span>
        <button class="btn" id="btnFx" title="Efeitos de tela" data-icone="faisca"><span class="rotulo-btn">Efeitos</span></button>
        <button class="btn icone" id="btnDesfazer" title="Desfazer (Ctrl+Z)" data-icone="desfazer"></button>
        <details class="menu">
          <summary class="btn icone" title="Mais opções" data-icone="reticencias"></summary>
          <div class="menu-lista">
            <button id="btnTelao" data-icone="tela">Copiar endereço do telão</button>
            <button id="btnDescanso" data-icone="lua">Descanso (cura todos os heróis)</button>
            <hr />
            <button id="btnReiniciar" data-icone="reiniciar">Reiniciar grupo de exemplo</button>
          </div>
        </details>
      </div>
    </header>

    <div class="faixas">
      <div class="faixa fx-painel" id="fxPainel" hidden></div>
      <div class="faixa ordem-m" id="ordemM" hidden></div>
    </div>

    <!-- Aba Galeria: imagens para mostrar aos jogadores -->
    <section class="galeria" id="abaGaleria" hidden>
      <div class="exibindo" id="exibindo" hidden>
        <div class="exibindo-img" id="exibindoImg"></div>
        <div class="exibindo-info">
          <span class="ao-vivo"><i></i>No telão agora</span>
          <input type="text" id="tituloExibindo" maxlength="80" placeholder="Título para os jogadores (opcional)" title="Enter salva o título" />
        </div>
        <button class="btn perigo" id="btnEsconder" data-icone="olhoFechado"><span>Esconder</span></button>
      </div>

      <header class="secao-topo">
        <h2>Galeria</h2><span class="conta" id="contaGaleria"></span>
        <div class="filtros" id="filtros"></div>
        <span class="deco"></span>
      </header>

      <div class="grade-galeria">
        <button class="tile-enviar" id="btnEnviar" type="button">
          <span class="icone-grande" data-icone="enviar"></span>
          <b>Enviar imagens</b>
          <small>Clique, arraste arquivos aqui<br />ou cole com Ctrl+V</small>
          <span class="destino" id="destinoEnvio"></span>
        </button>
        <div class="itens-galeria" id="itensGaleria"></div>
      </div>
      <input type="file" id="arquivos" accept="image/png,image/jpeg,image/webp,image/gif,image/svg+xml" multiple hidden />
    </section>

    <div class="soltar-aviso" aria-hidden="true">
      <div><span class="icone-grande" data-icone="enviar"></span><b>Solte para enviar</b><small id="soltarDestino"></small></div>
    </div>

    <main class="colunas" id="abaCombate">
      <section>
        <header class="secao-topo">
          <h2>Heróis</h2><span class="conta" id="contaAliados"></span><span class="deco"></span>
          <button class="btn pequeno" id="novoAliado" data-icone="mais">Novo herói</button>
        </header>
        <div class="lista" id="listaAliados"></div>
      </section>
      <section>
        <header class="secao-topo">
          <h2>Inimigos</h2><span class="conta" id="contaInimigos"></span><span class="deco"></span>
          <button class="btn pequeno" id="novoInimigo" data-icone="mais">Novo inimigo</button>
        </header>
        <div class="lista" id="listaInimigos"></div>
      </section>
    </main>

    <div class="selecao" id="selecao" hidden>
      <span class="conta-sel" id="contaSelecao"></span>
      <input type="number" min="1" id="valorSelecao" placeholder="Valor" />
      <button class="btn dano" data-modo="dano" data-icone="espada">Dano</button>
      <button class="btn cura" data-modo="cura" data-icone="coracao">Cura</button>
      <button class="btn icone fantasma" id="selLimpar" title="Limpar seleção" data-icone="fechar"></button>
    </div>

    <dialog id="editor"><form method="dialog" id="formEditor"></form></dialog>
    <div class="toast" id="toast"></div>
    <div class="bloqueio" id="bloqueio" hidden></div>
    <script type="module" src="/mestre.js"></script>
  </body>
</html>
